login:
  # ==================== 冒烟用例 ====================
  - case_id: LOGIN_001
    case: 正常登录
    tags:
      - smoke
      - login
    severity: critical
    description: 使用正确的用户名和密码登录，预期登录成功并返回 PHPSESSID
    request:
      accounts: huace_xm
      pwd: "${PASSWORD}"
      type: username
    expect:
      code: 0
      msg: 登录成功
      cookie:
        exists:
          - PHPSESSID

  # ==================== 异常校验 ====================
  - case_id: LOGIN_002
    case: 用户名为空
    tags:
      - regression
      - login
    severity: normal
    description: 用户名为空，预期返回账号不能为空提示
    request:
      accounts: ""
      pwd: "${PASSWORD}"
      type: username
    expect:
      code: -1
      msg: 登录账号不能为空

  - case_id: LOGIN_003
    case: 密码为空
    tags:
      - regression
      - login
    severity: normal
    description: 密码为空，预期返回密码格式错误提示
    request:
      accounts: huace_xm
      pwd: ""
      type: username
    expect:
      code: -1
      msg: 密码格式 6~18 个字符之间

  - case_id: LOGIN_004
    case: 用户名错误
    tags:
      - regression
      - login
    severity: normal
    description: 用户名不存在，预期返回登录帐号不存在
    request:
      accounts: not_exist_user
      pwd: "${PASSWORD}"
      type: username
    expect:
      code: -3
      msg: 登录帐号不存在

  - case_id: LOGIN_005
    case: 密码错误
    tags:
      - regression
      - login
    severity: normal
    description: 密码错误，预期返回密码错误
    request:
      accounts: huace_xm
      pwd: "${WRONG_PASSWORD}"
      type: username
    expect:
      code: -4
      msg: 密码错误

  # ==================== 边界 & 安全 ====================
  - case_id: LOGIN_006
    case: 密码长度5位（超出下限）
    tags:
      - boundary
      - login
    severity: minor
    description: 密码长度小于 6 位，预期校验失败
    request:
      accounts: huace_xm
      pwd: "12345"
      type: username
    expect:
      code: -1
      msg: 密码格式 6~18 个字符

  - case_id: LOGIN_007
    case: 密码长度19位（超出上限）
    tags:
      - boundary
      - login
    severity: minor
    description: 密码长度超过 18 位，预期校验失败
    request:
      accounts: huace_xm
      pwd: "1234567890123456789"
      type: username
    expect:
      code: -1
      msg: 密码格式 6~18 个字符

  - case_id: LOGIN_008
    case: SQL注入攻击
    tags:
      - security
      - login
    severity: critical
    description: 用户名包含 SQL 注入字符，预期被安全拦截
    request:
      accounts: "' or 1=1 --"
      pwd: "${PASSWORD}"
      type: username
    expect:
      code: -3
      msg: 登录帐号不存在

  - case_id: LOGIN_009
    case: 特殊字符用户名
    tags:
      - boundary
      - login
    severity: minor
    description: 用户名包含特殊字符，预期校验失败
    request:
      accounts: "huace@#$%"
      pwd: "${PASSWORD}"
      type: username
    expect:
      code: -3
      msg: 登录帐号不存在